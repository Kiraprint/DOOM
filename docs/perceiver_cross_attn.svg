<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" font-family="'Times New Roman',Times,serif" font-size="11">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="650" height="400" fill="#fafbfc" rx="4"/>
<text x="325" y="22" text-anchor="middle" font-weight="bold" font-size="13" fill="#1e3a5f">Perceiver IO: кросс-внимание и латентный массив</text>
<rect x="30" y="60" width="140" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="100" y="80" text-anchor="middle" font-weight="bold" fill="#1e40af">head_output</text><text x="100" y="93" text-anchor="middle" font-size="8" fill="#1e40af">(B, T, 512)</text>
<rect x="230" y="60" width="120" height="40" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="290" y="80" text-anchor="middle" font-weight="bold" fill="#4338ca">Input proj</text><text x="290" y="93" text-anchor="middle" font-size="8" fill="#4338ca">Linear(512 - d_model)</text>
<line x1="170" y1="80" x2="230" y2="80" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="150" width="130" height="55" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="105" y="172" text-anchor="middle" font-weight="bold" fill="#b45309">Latent Array</text><text x="105" y="188" text-anchor="middle" font-size="9" fill="#b45309">32 x 512 (learnable)</text>
<rect x="230" y="140" width="180" height="70" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
<text x="320" y="160" text-anchor="middle" font-weight="bold" fill="#047857">Cross-Attention</text>
<text x="320" y="176" text-anchor="middle" font-size="9" fill="#047857">Q=Latent(32x512) K,V=Input(Tx d_m)</text>
<line x1="105" y1="205" x2="240" y2="180" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="290" y1="100" x2="310" y2="140" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="230" y="250" width="180" height="50" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
<text x="320" y="272" text-anchor="middle" font-weight="bold" fill="#be185d">Self-Attention</text><text x="320" y="288" text-anchor="middle" font-size="9" fill="#be185d">Transformer bloki</text>
<line x1="320" y1="210" x2="320" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="460" y="190" width="100" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="510" y="210" text-anchor="middle" font-weight="bold" fill="#1e40af">Output</text><text x="510" y="223" text-anchor="middle" font-size="8" fill="#1e40af">- PolicyHead</text>
<line x1="410" y1="275" x2="510" y2="220" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="330" width="570" height="55" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="50" y="348" font-weight="bold" font-size="10" fill="#1e3a5f">Ключевое свойство:</text>
<text x="50" y="366" font-size="9" fill="#475569">* Размер латентного массива (32) не зависит от длины входной последовательности (T)</text>
<text x="50" y="382" font-size="9" fill="#475569">* Вычислительная стоимость: O(32*T) для кросс-внимания + O(32²) для самовнимания</text>
</svg>