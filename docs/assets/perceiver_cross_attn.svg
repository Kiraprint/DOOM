<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="800" height="420" fill="#fafbfc" rx="4"/>
<text x="400" y="22" text-anchor="middle" font-weight="bold" font-size="13" fill="#1e3a5f">Perceiver IO: кросс-внимание и латентный массив</text>

<!-- ===== TOP ROW ===== -->
<rect x="30" y="55" width="140" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="100" y="75" text-anchor="middle" font-weight="bold" fill="#1e40af">head_output</text>
<text x="100" y="88" text-anchor="middle" font-size="8" fill="#1e40af">(B, T, 512)</text>

<line x1="170" y1="75" x2="195" y2="75" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="55" width="160" height="40" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="280" y="75" text-anchor="middle" font-weight="bold" fill="#4338ca">Input proj</text>
<text x="280" y="88" text-anchor="middle" font-size="8" fill="#4338ca">Linear(512 → d_model)</text>

<line x1="280" y1="95" x2="280" y2="125" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ===== MIDDLE: Cross-Attention ===== -->
<rect x="30" y="140" width="150" height="55" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="105" y="162" text-anchor="middle" font-weight="bold" fill="#b45309">Latent Array</text>
<text x="105" y="178" text-anchor="middle" font-size="9" fill="#b45309">32 × 512 (learnable)</text>

<line x1="180" y1="167" x2="245" y2="167" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="245" y="130" width="280" height="75" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
<text x="385" y="153" text-anchor="middle" font-weight="bold" fill="#047857">Cross-Attention</text>
<text x="385" y="170" text-anchor="middle" font-size="9" fill="#047857">Q=Latent(32×512)  K,V=Input(T×d_m)</text>
<text x="385" y="187" text-anchor="middle" font-size="8" fill="#047857" font-style="italic">кросс-внимание между латентами и входом</text>

<line x1="385" y1="205" x2="385" y2="240" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Self-Attention -->
<rect x="245" y="245" width="280" height="55" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
<text x="385" y="267" text-anchor="middle" font-weight="bold" fill="#be185d">Self-Attention</text>
<text x="385" y="283" text-anchor="middle" font-size="9" fill="#be185d">Transformer блоки</text>

<!-- Arrow right past the diagram -->
<line x1="525" y1="272" x2="575" y2="272" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="548" y="266" text-anchor="middle" font-size="9" fill="#4B5563">PolicyHead</text>

<rect x="580" y="252" width="140" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="650" y="272" text-anchor="middle" font-weight="bold" fill="#1e40af">Output</text>
<text x="650" y="285" text-anchor="middle" font-size="8" fill="#1e40af">(B, num_actions)</text>

<!-- ===== INFO BOX ===== -->
<rect x="30" y="340" width="740" height="60" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="40" y="358" font-weight="bold" font-size="10" fill="#1e3a5f">Ключевое свойство:</text>
<text x="40" y="376" font-size="9" fill="#475569">* Размер латентного массива (32) не зависит от длины входной последовательности (T)</text>
<text x="40" y="394" font-size="9" fill="#475569">* Вычислительная стоимость: O(32·T) для кросс-внимания + O(32²) для самовнимания</text>
</svg>