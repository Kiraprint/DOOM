<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1.5" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow-lg" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="870" height="420" fill="#fafbfc" rx="6"/>
  <text x="435" y="22" text-anchor="middle" font-weight="600" font-size="13" fill="#1e3a5f" letter-spacing="0.3">Mamba-2: Структурированный SSM-блок</text>

  <g transform="translate(0, 0)">

    <!-- Input x_t -->
    <rect x="10" y="190" width="64" height="38" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="42" y="215" text-anchor="middle" font-weight="600" font-size="12" fill="#1d4ed8">xₜ</text>

    <line x1="74" y1="209" x2="94" y2="209" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- RMSNorm -->
    <rect x="94" y="188" width="78" height="42" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="133" y="210" text-anchor="middle" font-weight="600" font-size="10" fill="#047857">RMSNorm</text>
    <text x="133" y="224" text-anchor="middle" font-size="8" fill="#047857">нормализация</text>

    <!-- Branch arrows -->
    <line x1="172" y1="209" x2="172" y2="150" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="172" y1="150" x2="192" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="172" y1="209" x2="172" y2="268" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="172" y1="268" x2="192" y2="268" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- ============ TOP BRANCH ============ -->

    <!-- Conv1d -->
    <rect x="192" y="129" width="72" height="42" rx="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="228" y="151" text-anchor="middle" font-weight="600" font-size="10" fill="#6d28d9">Conv1d</text>
    <text x="228" y="164" text-anchor="middle" font-size="8" fill="#6d28d9">свёртка</text>

    <line x1="264" y1="150" x2="279" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- SiLU (top) -->
    <rect x="279" y="129" width="62" height="42" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="310" y="151" text-anchor="middle" font-weight="600" font-size="10" fill="#b45309">SiLU</text>
    <text x="310" y="164" text-anchor="middle" font-size="8" fill="#b45309">активация</text>

    <line x1="341" y1="150" x2="356" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- SSM block (wider) -->
    <rect x="356" y="115" width="130" height="70" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow-lg)"/>
    <text x="421" y="137" text-anchor="middle" font-weight="600" font-size="11" fill="#b91c1c">SSM</text>
    <text x="421" y="152" text-anchor="middle" font-size="9" fill="#b91c1c">hₜ = Ā·hₜ₋₁ + B̄·xₜ</text>
    <text x="421" y="166" text-anchor="middle" font-size="9" fill="#b91c1c">yₜ = C·hₜ + D·xₜ</text>
    <text x="421" y="179" text-anchor="middle" font-size="7.5" fill="#dc2626" font-style="italic">A — структурированная матрица</text>

    <!-- SSM → multiply (shifted right) -->
    <line x1="486" y1="150" x2="540" y2="150" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="540" y1="150" x2="540" y2="204" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="540" y1="204" x2="555" y2="204" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- ============ BOTTOM BRANCH ============ -->

    <!-- SiLU (bottom) -->
    <rect x="192" y="247" width="62" height="42" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="223" y="269" text-anchor="middle" font-weight="600" font-size="10" fill="#b45309">SiLU</text>
    <text x="223" y="282" text-anchor="middle" font-size="8" fill="#b45309">активация</text>

    <line x1="254" y1="268" x2="540" y2="268" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="540" y1="268" x2="540" y2="209" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="540" y1="209" x2="555" y2="209" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- ============ MIDDLE ROW CONTINUES ============ -->

    <!-- Multiply (shifted right) -->
    <circle cx="580" cy="209" r="20" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="580" y="210" text-anchor="middle" font-weight="bold" font-size="16" fill="#374151">⊗</text>

    <line x1="600" y1="209" x2="620" y2="209" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- RMSNorm (final) -->
    <rect x="620" y="188" width="78" height="42" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="659" y="210" text-anchor="middle" font-weight="600" font-size="10" fill="#047857">RMSNorm</text>
    <text x="659" y="224" text-anchor="middle" font-size="8" fill="#047857">нормализация</text>

    <line x1="698" y1="209" x2="718" y2="209" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Add (residual) -->
    <circle cx="740" cy="209" r="19" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="740" y="210" text-anchor="middle" font-weight="bold" font-size="16" fill="#374151">⊕</text>

    <line x1="759" y1="209" x2="779" y2="209" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Output y_t -->
    <rect x="779" y="190" width="64" height="38" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="811" y="215" text-anchor="middle" font-weight="600" font-size="12" fill="#1d4ed8">yₜ</text>

    <!-- Residual connection -->
    <line x1="42" y1="228" x2="42" y2="340" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5,4"/>
    <line x1="42" y1="340" x2="740" y2="340" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5,4"/>
    <line x1="740" y1="340" x2="740" y2="228" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
    <text x="370" y="355" text-anchor="middle" font-size="9" fill="#9ca3af" font-style="italic">Residual connection (skip)</text>

  </g>

  <!-- ============ FOOTER ============ -->
  <rect x="15" y="372" width="840" height="38" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="30" y="392" font-weight="600" font-size="9" fill="#1e3a5f">Селективность (вход-зависимые параметры):</text>
  <text x="260" y="392" font-size="8.5" fill="#475569">Δ = softplus(Linear(xₜ))</text>
  <text x="410" y="392" font-size="8.5" fill="#475569">B = W_B · xₜ</text>
  <text x="550" y="392" font-size="8.5" fill="#475569">C = W_C · xₜ</text>
  <text x="690" y="392" font-size="8.5" fill="#475569">A — диагональ + low-rank</text>
</svg>