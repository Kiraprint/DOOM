<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 460" font-family="'Times New Roman',Times,serif" font-size="11">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="550" height="460" fill="#fafbfc" rx="4"/>
<text x="275" y="22" text-anchor="middle" font-weight="bold" font-size="13" fill="#1e3a5f">Scaled Dot-Product Attention</text>
<rect x="30" y="50" width="120" height="35" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="90" y="72" text-anchor="middle" font-weight="bold" fill="#1e40af">Vhod X</text>
<rect x="30" y="120" width="100" height="35" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="80" y="142" text-anchor="middle" font-weight="bold" fill="#4338ca">Q = XW_Q</text>
<rect x="150" y="120" width="100" height="35" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="200" y="142" text-anchor="middle" font-weight="bold" fill="#4338ca">K = XW_K</text>
<rect x="270" y="120" width="100" height="35" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="320" y="142" text-anchor="middle" font-weight="bold" fill="#4338ca">V = XW_V</text>
<line x1="90" y1="85" x2="80" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="90" y1="85" x2="200" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="90" y1="85" x2="320" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="130" y="190" width="160" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="210" y="212" text-anchor="middle" font-weight="bold" fill="#b45309">Score = QK^T</text>
<line x1="80" y1="155" x2="210" y2="190" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<line x1="200" y1="155" x2="210" y2="190" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<rect x="130" y="255" width="160" height="35" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
<text x="210" y="277" text-anchor="middle" font-weight="bold" fill="#be185d">: sqrt(d_k)</text>
<line x1="210" y1="225" x2="210" y2="255" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="130" y="320" width="160" height="35" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
<text x="210" y="342" text-anchor="middle" font-weight="bold" fill="#047857">softmax</text>
<line x1="210" y1="290" x2="210" y2="320" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="130" y="385" width="160" height="35" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="210" y="407" text-anchor="middle" font-weight="bold" fill="#6d28d9">Attention = * V</text>
<line x1="210" y1="355" x2="210" y2="385" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="320" y1="155" x2="290" y2="400" stroke="#4B5563" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#a)"/>
<rect x="355" y="385" width="100" height="35" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="405" y="407" text-anchor="middle" font-weight="bold" fill="#1e40af">Output</text>
<line x1="290" y1="402" x2="355" y2="402" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="430" width="510" height="25" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="275" y="446" text-anchor="middle" font-size="9" fill="#475569">Attention(Q,K,V) = softmax( QK^T / sqrt(d_k) ) V</text>
</svg>