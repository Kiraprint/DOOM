<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="'Times New Roman',Times,serif" font-size="11">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="700" height="260" fill="#fafbfc" rx="4"/>
<text x="350" y="22" text-anchor="middle" font-weight="bold" font-size="13" fill="#1e3a5f">HPO pipeline: байесовская оптимизация с ASHA-прунингом</text>

<rect x="30" y="55" width="130" height="45" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="95" y="73" text-anchor="middle" font-weight="bold" fill="#1e40af">Search Space</text><text x="95" y="88" text-anchor="middle" font-size="8" fill="#1e40af">d_model, d_state, lr...</text>

<rect x="210" y="55" width="130" height="45" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="275" y="73" text-anchor="middle" font-weight="bold" fill="#b45309">TPE Sampler</text><text x="275" y="88" text-anchor="middle" font-size="8" fill="#b45309">Tree Parzen Estimator</text>

<rect x="390" y="55" width="130" height="45" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
<text x="455" y="73" text-anchor="middle" font-weight="bold" fill="#be185d">Trial</text><text x="455" y="88" text-anchor="middle" font-size="8" fill="#be185d">обучение 50M шагов</text>

<rect x="570" y="55" width="100" height="45" rx="4" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
<text x="620" y="73" text-anchor="middle" font-weight="bold" fill="#047857">Result</text><text x="620" y="88" text-anchor="middle" font-size="8" fill="#047857">best reward</text>

<line x1="160" y1="77" x2="210" y2="77" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="340" y1="77" x2="390" y2="77" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="520" y1="77" x2="570" y2="77" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="30" y="130" width="640" height="110" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="50" y="150" font-weight="bold" font-size="10" fill="#1e3a5f">Механизм прунинга (ASHA):</text>
<text x="50" y="168" font-size="9" fill="#475569">1. Каждый trial оценивается после 10 эпох обучения</text>
<text x="50" y="184" font-size="9" fill="#475569">2. Если средняя награда ниже медианы среди активных trialов того же уровня -- trial останавливается</text>
<text x="50" y="200" font-size="9" fill="#475569">3. 54% trialов были прерваны (из 85 запущенных 37 завершились)</text>
<text x="50" y="218" font-size="9" fill="#475569">4. Время на 85 trialов: 2507 секунд (~42 минуты) на RTX 5090 Laptop GPU</text>
</svg>