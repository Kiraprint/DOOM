<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Times New Roman',Times,serif" font-size="11">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0" y="0" width="720" height="380" fill="#fafbfc" rx="4"/>
<text x="360" y="22" text-anchor="middle" font-weight="bold" font-size="13" fill="#1e3a5f">Upravlenie sostoyaniem Mamba-2: encode/decode v rnn_states</text>
<rect x="30" y="50" width="140" height="55" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="100" y="70" text-anchor="middle" font-weight="bold" fill="#1e40af">conv_state</text><text x="100" y="86" text-anchor="middle" font-size="9" fill="#1e40af">(batch, d_conv_dim, d_conv)</text><text x="100" y="98" text-anchor="middle" font-size="8" fill="#1e40af">4 x d_model (=512) = 2048</text>
<rect x="30" y="130" width="140" height="55" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="100" y="150" text-anchor="middle" font-weight="bold" fill="#1e40af">ssm_state</text><text x="100" y="166" text-anchor="middle" font-size="9" fill="#1e40af">(batch, nheads, headdim, d_state)</text><text x="100" y="178" text-anchor="middle" font-size="8" fill="#1e40af">8 x 128 x 128 = 131072</text>
<rect x="250" y="80" width="130" height="45" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="315" y="100" text-anchor="middle" font-weight="bold" fill="#b45309">Mamba2StateEncoder</text><text x="315" y="115" text-anchor="middle" font-size="9" fill="#b45309">reshape + concat</text>
<line x1="100" y1="105" x2="260" y2="100" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="100" y1="185" x2="280" y2="110" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="450" y="80" width="140" height="45" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
<text x="520" y="100" text-anchor="middle" font-weight="bold" fill="#047857">rnn_states</text><text x="520" y="115" text-anchor="middle" font-size="9" fill="#047857">(batch, 1, total_size)</text>
<line x1="380" y1="102" x2="450" y2="102" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="250" y="190" width="130" height="45" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
<text x="315" y="210" text-anchor="middle" font-weight="bold" fill="#be185d">Mamba2StateDecoder</text><text x="315" y="225" text-anchor="middle" font-size="9" fill="#be185d">split + reshape</text>
<line x1="520" y1="125" x2="520" y2="212" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="380" y1="212" x2="170" y2="212" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#b)"/>
<text x="200" y="225" font-size="8" fill="#9CA3AF">decode</text>
<rect x="30" y="190" width="140" height="45" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="100" y="210" text-anchor="middle" font-weight="bold" fill="#1e40af">conv_state + ssm_state</text><text x="100" y="225" text-anchor="middle" font-size="8" fill="#1e40af">vosstanovlennye</text>
<line x1="170" y1="212" x2="100" y2="212" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="30" y="280" width="660" height="80" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="50" y="300" font-weight="bold" font-size="10" fill="#1e3a5f">Algoritm opredeleniya granicy epizoda:</text>
<text x="50" y="318" font-size="9" fill="#475569">1. Sample Factory obnulyaet rnn_states pri zavershenii epizoda (vse elementy = 0)</text>
<text x="50" y="334" font-size="9" fill="#475569">2. Na sleduyushem shage Mamba2Decoder proveryaet L2-normu prinyatogo tensora</text>
<text x="50" y="350" font-size="9" fill="#475569">3. Esli norma &lt; 1e-6: sostoanie schitaetsya obnulennym, inicializaciya novogo conv_state + ssm_state</text>
</svg>