<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="'Times New Roman',Times,serif" font-size="11">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="500" height="320" fill="#fafbfc" rx="4"/>
<text x="250" y="22" text-anchor="middle" font-weight="bold" font-size="13" fill="#1e3a5f">Multi-Head Self-Attention</text>
<rect x="30" y="50" width="120" height="35" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="90" y="72" text-anchor="middle" font-weight="bold" fill="#1e40af">X</text>
<rect x="200" y="50" width="120" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="260" y="72" text-anchor="middle" font-weight="bold" fill="#b45309">Linear x 3h</text>
<line x1="150" y1="67" x2="200" y2="67" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="200" y="120" width="250" height="60" rx="4" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
<text x="325" y="140" text-anchor="middle" font-weight="bold" fill="#047857">Scaled Dot-Product Attention x h</text>
<text x="325" y="158" text-anchor="middle" font-size="9" fill="#047857">head_i = Attention(Q_i, K_i, V_i) dlya i=1..h</text>
<line x1="260" y1="85" x2="325" y2="120" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="200" y="210" width="120" height="35" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="260" y="232" text-anchor="middle" font-weight="bold" fill="#4338ca">Concat</text>
<line x1="325" y1="180" x2="260" y2="210" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="200" y="275" width="120" height="35" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="260" y="297" text-anchor="middle" font-weight="bold" fill="#1e40af">W_O</text>
<line x1="260" y1="245" x2="260" y2="275" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="30" y="275" width="140" height="30" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
<text x="100" y="294" text-anchor="middle" font-size="9" fill="#475569">MultiHead(Q,K,V)=Concat(head_i)W_O</text>
